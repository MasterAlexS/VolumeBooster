<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title-group">
        <h2 data-i18n="extName">Volume Booster</h2>
        <div id="activeTabInfo" class="tab-info" data-i18n="loading">Loading...</div>
      </div>
      <div class="header-controls">
        <button id="themeToggle" class="icon-btn" data-i18n-title="themeToggleTitle" title="Toggle Light/Dark Mode">🌓</button>
        <label class="switch" data-i18n-title="boostToggleTitle" title="Toggle Boost ON/OFF">
          <input type="checkbox" id="masterToggle">
          <span class="slider round"></span>
        </label>
      </div>
    </div>

    <div class="limit-toggle-group">
      <span class="label"><span data-i18n="standardMode">Standard</span> (600%)</span>
      <label class="switch small" data-i18n-title="extremeToggleTitle" title="Toggle 1000% Extreme Mode">
        <input type="checkbox" id="limitToggle">
        <span class="slider round"></span>
      </label>
      <span class="label extreme"><span data-i18n="extremeMode">Extreme</span> (1000%)</span>
    </div>

    <div class="slider-wrapper">
      <div id="volumeValue" class="glow-green">100%</div>
      <input type="range" id="volumeSlider" min="0" max="600" step="10" value="100">
    </div>

    <div class="button-group">
      <button id="resetBtn" data-i18n-title="resetBtnTitle" title="Set to 100%">100%</button>
      <button id="applyLastBtn"><span data-i18n="applyLastBtn">Apply Last</span>: <span id="lastVolText">100%</span></button>
    </div>
    
    <div class="footer-controls">
      <select id="langSelect" class="lang-select" data-i18n-title="langSelectTitle" title="Change Language"></select>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
